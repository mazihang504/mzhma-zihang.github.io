paginate: 5
paginate_path: "/page:num/"

# 作者信息
author:
  name: "马梓杭"
  email: "2968703652@qq.com"
  github: "mzhma-zihang"

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
